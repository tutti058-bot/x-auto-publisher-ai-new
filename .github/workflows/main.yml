name: AI Auto News

on:
  workflow_dispatch:

  schedule:
    - cron: '0 0 * * *'

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install jq
        run: |
          sudo apt update
          sudo apt install -y jq

      - name: Install packages
        run: npm install

      - name: Get News
        env:
          NEWS_API_KEY: ${{ secrets.NEWS_API_KEY }}
        run: |
          mkdir -p posts

          curl -s -L \
          "https://newsapi.org/v2/top-headlines?country=us&category=technology&pageSize=1&apiKey=$NEWS_API_KEY" \
          -o news.json

          jq -r '.articles[0].title' news.json > posts/title.txt
          jq -r '.articles[0].urlToImage' news.json > posts/image.txt
          jq -r '.articles[0].url' news.json > posts/url.txt

      - name: OpenAI Summary
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          TITLE=$(cat posts/title.txt)

          jq -n \
            --arg title "$TITLE" \
            '{
              model:"gpt-4.1-mini",
              messages:[
                {
                  role:"system",
                  content:"あなたはニュース編集者です。必ず次の形式だけで返してください。\n\n1行目: タイトルのみ（30文字以内）\n2行目: 空行\n3行目以降: 200文字程度の要約\n\n【タイトル】や【要約】などの見出しは絶対に付けないでください。"
                },
                {
                  role:"user",
                  content:$title
                }
              ]
            }' > request.json

          curl -s https://api.openai.com/v1/chat/completions \
            -H "Authorization: Bearer $OPENAI_API_KEY" \
            -H "Content-Type: application/json" \
            -d @request.json \
            > response.json

          cat response.json

          jq -r '.choices[0].message.content' response.json > posts/post.txt

      - name: Build JSON
        run: |
          npm start

      - name: Show Result
        run: |
          echo "===== title ====="
          cat posts/title.txt

          echo ""
          echo "===== post ====="
          cat posts/post.txt

          echo ""
          echo "===== news ====="
          cat data/news.json

      - name: Commit
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"

          git add .

          if ! git diff --cached --quiet; then
            git commit -m "AI News Update"
            git push
          fi