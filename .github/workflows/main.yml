name: AI Auto News

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install jq
        run: |
          sudo apt update
          sudo apt install -y jq

      - name: Install packages
        run: npm install

      - name: Get News
        env:
          NEWS_API_KEY: ${{ secrets.NEWS_API_KEY }}
        run: |
          mkdir -p posts

          curl -s -L \
          "https://newsapi.org/v2/top-headlines?country=us&category=technology&pageSize=5&apiKey=$NEWS_API_KEY" \
          -o news.json

      - name: AI Summary
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          mkdir -p posts

          COUNT=$(jq '.articles | length' news.json)

          for ((i=0;i<COUNT;i++))
          do
            TITLE=$(jq -r ".articles[$i].title" news.json)
            IMAGE=$(jq -r ".articles[$i].urlToImage" news.json)
            URL=$(jq -r ".articles[$i].url" news.json)

            jq -n \
              --arg title "$TITLE" \
              '{
                model:"gpt-4.1-mini",
                messages:[
                  {
                    role:"system",
                    content:"ニュースを日本語に翻訳し、1行目をタイトル、2行目以降を200文字程度の要約だけ返してください。"
                  },
                  {
                    role:"user",
                    content:$title
                  }
                ]
              }' > request.json

            curl -s https://api.openai.com/v1/chat/completions \
              -H "Authorization: Bearer $OPENAI_API_KEY" \
              -H "Content-Type: application/json" \
              -d @request.json \
              > response.json

            jq -r '.choices[0].message.content' response.json > posts/post$i.txt
            echo "$IMAGE" > posts/image$i.txt
            echo "$URL" > posts/url$i.txt
          done

      - name: Build JSON
        run: npm start

      - name: Commit
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"

          git add .

          if ! git diff --cached --quiet; then
            git commit -m "AI News Update"
            git push
          fi