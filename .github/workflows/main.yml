name: AI Auto News

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install jq
        run: |
          sudo apt update
          sudo apt install -y jq

      - name: Get News
        env:
          NEWS_API_KEY: ${{ secrets.NEWS_API_KEY }}
        run: |
          mkdir -p posts

          curl -L "https://newsapi.org/v2/top-headlines?country=us&category=technology&pageSize=1&apiKey=$NEWS_API_KEY" -o news.json

          jq -r '.articles[0].title' news.json > posts/title.txt
          jq -r '.articles[0].urlToImage' news.json > posts/image.txt
          jq -r '.articles[0].url' news.json > posts/url.txt

      - name: OpenAI Summary
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          TITLE=$(cat posts/title.txt)

          jq -n \
            --arg title "$TITLE" \
            '{
              model:"gpt-4.1-mini",
              messages:[
                {
                  role:"user",
                  content:("次のニュースを日本語化してください。必ず次の形式で出力しください。1行目：タイトルの2行目以降：200文字程度の要約見出し（【タイトル】や【要約】）は絶対に付けないでください。\n\n" + $title)
                }
              ]
            }' > request.json

          curl https://api.openai.com/v1/chat/completions \
            -H "Authorization: Bearer $OPENAI_API_KEY" \
            -H "Content-Type: application/json" \
            -d @request.json \
            -o response.json

          cat response.json

          jq -r '.choices[0].message.content' response.json > posts/post.txt

      - name: Run Build
        run: |
          npm install
          npm start

      - name: Show Result
        run: |
          echo "===== news.json ====="
          cat data/news.json

      - name: Commit
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"

          git add .

          git diff --cached --quiet || git commit -m "AI News"

          git push