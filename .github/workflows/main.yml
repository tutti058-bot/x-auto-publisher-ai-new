name: AI Auto Publish

on:
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm install

      - run: sudo apt update && sudo apt install -y jq

      - name: Get News
        env:
          NEWS_API_KEY: ${{ secrets.NEWS_API_KEY }}
        run: |
          mkdir -p posts

          curl -L \
          "https://newsapi.org/v2/top-headlines?country=us&category=technology&pageSize=1&apiKey=$NEWS_API_KEY" \
          -o news.json

          jq -r '.articles[0].title' news.json > title.txt
          jq -r '.articles[0].urlToImage' news.json > posts/image.txt
          jq -r '.articles[0].url' news.json > posts/url.txt

      - name: OpenAI
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          TITLE=$(cat title.txt)

          curl https://api.openai.com/v1/chat/completions \
          -H "Authorization: Bearer $OPENAI_API_KEY" \
          -H "Content-Type: application/json" \
          -d "{
            \"model\":\"gpt-4.1-mini\",
            \"messages\":[
              {
                \"role\":\"user\",
                \"content\":\"次のニュースを日本語でタイトルを付け、その後に280文字以内で要約してください。1行目をタイトル、2行目以降を本文にしてください。\n\n$TITLE\"
              }
            ]
          }" \
          | jq -r '.choices[0].message.content' > posts/post.txt

      - run: npm start

      - name: Commit
        run: |
          git config user.name github-actions
          git config user.email actions@github.com

          git add .

          git diff --cached --quiet || git commit -m "Auto update"

          git push