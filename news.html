<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>AI NEWS</title>

<style>

body{
    margin:0;
    background:#f5f5f5;
    font-family:sans-serif;
}

header{

    color:#fff;
    text-align:center;
    padding:20px;
}

.container{
    max-width:900px;
    margin:40px auto;
    background:#fff;
    border-radius:12px;
    overflow:hidden;
    box-shadow:0 5px 15px rgba(0,0,0,.1);

img{
    width:100%;
    display:block;
}

.content{
    padding:30px;
}

h1{
    margin-top:0;
}

p{
    line-height:1.9;
}

.button{
    display:inline-block;
    margin-top:20px;
    padding:12px 22px;
    background:#111827;
    color:#fff;
    text-decoration:none;
    border-radius:8px;
}

.back{
    margin-left:10px;
    background:#666;
}

</style>

</head>

<body>

<header>

</header>

<div class="container">

<img id="image">

<div class="content">

元記事を読む
</a>

<a href="index.html" class="button back">

</a>

</div>

</div>

<script type="module" src="news.js"></script>

</html>
