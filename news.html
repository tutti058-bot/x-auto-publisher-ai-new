<!DOCTYPE html>
<html lang="ja">

<head>
<script async
src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-xxxxxxxxxxxxxxxx"
crossorigin="anonymous"></script>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>AI NEWS</title>

<meta name="description" content="AIニュース記事">

<meta property="og:type" content="article">
<meta property="og:site_name" content="AI NEWS">
<meta property="og:title" content="AI NEWS">
<meta property="og:description" content="世界のAIニュースをリアルタイム配信">
<meta property="og:image" content="https://x-auto-publisher-ai-new.vercel.app/images/ogp.jpg">

<link rel="icon" type="image/png" href="images/favicon.png">

<style>

*{

margin:0;

padding:0;

box-sizing:border-box;

}

body{

font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;

background:#f5f7fb;

color:#111827;

line-height:1.9;

}

a{

text-decoration:none;

color:inherit;

}

header{

position:sticky;

top:0;

z-index:999;

background:#111827;

color:#fff;

padding:18px 25px;

display:flex;

justify-content:space-between;

align-items:center;

box-shadow:0 5px 20px rgba(0,0,0,.15);

}

.logo{
    display:flex;
    align-items:center;
    text-decoration:none;
}

.logo img{
    width:220px;
    height:auto;
    display:block;
}

.home-btn{

background:#2563eb;

padding:10px 18px;

border-radius:10px;

color:#fff;

font-weight:bold;

transition:.25s;

}

.home-btn:hover{

background:#1d4ed8;

}

.article{

max-width:1000px;

margin:50px auto;

background:#fff;

border-radius:24px;

overflow:hidden;

box-shadow:0 15px 40px rgba(0,0,0,.08);

}

.hero-image{

width:100%;

height:500px;

object-fit:cover;

display:block;

}

.content{

padding:45px;

}

.category{

display:inline-block;

background:#2563eb;

color:#fff;

padding:8px 18px;

border-radius:999px;

font-size:14px;

font-weight:bold;

margin-bottom:20px;

}

.title{

font-size:42px;

font-weight:800;

line-height:1.4;

margin-bottom:20px;

}

.date{

color:#6b7280;

margin-bottom:30px;

font-size:15px;

}

.summary{

font-size:20px;

line-height:2;

margin-bottom:40px;

color:#374151;

}

.article-body{

font-size:19px;

line-height:2.2;

margin-bottom:50px;

}

.article-body p{

margin-bottom:22px;

}

.share{

display:flex;

gap:15px;

flex-wrap:wrap;

margin:40px 0;

}

.share a{

padding:12px 22px;

border-radius:10px;

background:#2563eb;

color:#fff;

font-weight:bold;

transition:.25s;

}

.share a:hover{

background:#1d4ed8;

}

.related{

margin-top:60px;

border-top:1px solid #e5e7eb;

padding-top:40px;

}

.related h2{

font-size:28px;

margin-bottom:25px;

}

.related-list{

display:grid;

grid-template-columns:repeat(2,1fr);

gap:20px;

}

.related-card{

background:#f8fafc;

border-radius:16px;

overflow:hidden;

transition:.25s;

box-shadow:0 8px 20px rgba(0,0,0,.08);

}

.related-card:hover{

transform:translateY(-3px);

}

.related-card img{

width:100%;

height:180px;

object-fit:cover;

}

.related-card div{

padding:18px;

font-weight:bold;

}

.footer-nav{

display:flex;

justify-content:space-between;

margin-top:50px;

gap:20px;

}

.footer-nav a{

flex:1;

padding:16px;

background:#111827;

color:#fff;

border-radius:14px;

text-align:center;

font-weight:bold;

}

@media(max-width:768px){

.article{

margin:20px;

}

.hero-image{

height:240px;

}

.content{

padding:25px;

}

.title{

font-size:30px;

}

.related-list{

grid-template-columns:1fr;

}

.footer-nav{

flex-direction:column;

}

}

</style>

</head>

<body>

<header>

<a href="index.html" class="logo">
    <img src="images/header-logo.png" alt="AI NEWS">
</a>

<a href="index.html" class="home-btn">
🏠 ホーム
</a>

</header>

<article class="article">

<img id="hero-image" class="hero-image" src="" alt="">

<div class="content">

<span id="category" class="category">
AI
</span>

<h1 id="title" class="title">
読み込み中...
</h1>

<div id="date" class="date">
</div>

<div id="summary" class="summary">
</div>

<div id="article-body" class="article-body">
</div>

<a id="original-link"
   href="#"
   target="_blank"
   class="home-btn"
   style="display:inline-block;margin-top:25px;">
🌐 元の記事を読む
</a>

<div class="share">

<a id="share-x" href="#" target="_blank">
𝕏 でシェア
</a>

<a id="share-facebook" href="#" target="_blank">
Facebook
</a>

<a id="share-line" href="#" target="_blank">
LINE
</a>

</div>

<div class="related">

<h2>
関連記事
</h2>

<div id="related-list" class="related-list">

</div>

</div>

<div class="footer-nav">

<a id="prev-post" href="#">
⬅ 前の記事
</a>

<a href="index.html">
🏠 ホームへ戻る
</a>

<a id="next-post" href="#">
次の記事 ➡
</a>

</div>

</div>

</article>

<script type="module" src="news.js"></script>

</body>
</html>
