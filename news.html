<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>AI NEWS</title>

<style>

body{
    margin:0;
    background:#f5f5f5;
    font-family:sans-serif;
}

header{
    background:#111827;
    color:#fff;
    text-align:center;
    padding:20px;
}

.container{
    max-width:900px;
    margin:40px auto;
    background:#fff;
    border-radius:12px;
    overflow:hidden;
    box-shadow:0 5px 15px rgba(0,0,0,.1);
}

img{
    width:100%;
    display:block;
}

.content{
    padding:30px;
}

h1{
    margin-top:0;
}

p{
    line-height:1.9;
}

.button{
    display:inline-block;
    margin-top:20px;
    padding:12px 22px;
    background:#111827;
    color:#fff;
    text-decoration:none;
    border-radius:8px;
}

.button:hover{
    opacity:.9;
}

.back{
    margin-left:10px;
    background:#666;
}

#related-news{
    margin-top:30px;
}

.related-card{
    display:flex;
    gap:15px;
    border:1px solid #eee;
    border-radius:10px;
    overflow:hidden;
    margin-bottom:20px;
    background:#fff;
    transition:.2s;
}

.related-card:hover{
    box-shadow:0 5px 15px rgba(0,0,0,.08);
}

.related-card img{
    width:180px;
    height:120px;
    object-fit:cover;
}

.related-content{
    padding:15px;
    flex:1;
}

.related-content h3{
    margin:0 0 10px;
    font-size:18px;
}

.related-content p{
    margin:0;
    color:#666;
    line-height:1.6;
    font-size:14px;
}

.related-content a{
    color:#111827;
    text-decoration:none;
}

.related-content a:hover{
    color:#2563eb;
}

@media(max-width:768px){

.related-card{
    display:block;
}

.related-card img{
    width:100%;
    height:auto;
}

}

</style>

</head>

<body>

<header>

<h1>AI NEWS</h1>

</header>

<div class="container">

<img id="image">

<div class="content">

<h1 id="title"></h1>

<p id="summary"></p>

<div style="display:flex;flex-direction:column;align-items:center;gap:18px;margin-top:30px;">

<a id="link" class="button" target="_blank">
元記事を読む
</a>

<div id="share-buttons"
style="
display:flex;
flex-direction:row;
justify-content:flex-end;
align-items:center;
gap:8px;
margin:15px 0 20px;
width:100%;
">

<button id="share-x" class="button"
style="padding:8px 14px;font-size:14px;">
🐦 X
</button>

<button id="share-line" class="button"
style="background:#06C755;padding:8px 14px;font-size:14px;">
💚 LINE
</button>

<button id="copy-link" class="button"
style="background:#2563eb;padding:8px 14px;font-size:14px;">
🔗 コピー
</button>

</div>

<div id="copy-message" style="display:none;color:#16a34a;font-weight:bold;">
✅ リンクをコピーしました！
</div>

<a href="index.html" class="button back">
← 一覧へ戻る
</a>

</div>

<hr style="margin:50px 0;">

<h2>📚 関連記事</h2>

<div id="related-news"></div>

</div>

</div>

<script type="module" src="news.js"></script>

</body>
</html>
