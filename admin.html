<!DOCTYPE html>
<html lang="ja">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>AI NEWS 管理画面</title>

<style>

body{

font-family:sans-serif;
background:#f5f7fb;
margin:0;
padding:30px;

}

h1{

color:#0f172a;

}

<div style="margin:25px 0;display:flex;gap:15px;flex-wrap:wrap;">

<button onclick="showToday()">
📰 今日の記事
</button>

<button onclick="showUnposted()">
📋 未投稿だけ
</button>

<button onclick="postAll()">
🚀 今日の記事を全部投稿
</button>

</div>

.card{

background:#fff;
padding:20px;
margin-bottom:20px;
border-radius:12px;
box-shadow:0 5px 15px rgba(0,0,0,.08);

}

button{

padding:10px 18px;
margin-right:10px;
cursor:pointer;
border:none;
border-radius:8px;
background:#2563eb;
color:#fff;
font-weight:bold;

}

button:hover{

opacity:.9;

}

</style>

</head>

<body>

<h1>🤖 AI NEWS 管理画面</h1>

<div id="news-list"></div>

<script src="admin.js"></script>

</body>
</html>
