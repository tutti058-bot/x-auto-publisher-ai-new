<!DOCTYPE html>
<html lang="ja">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>お問い合わせ | AI NEWS</title>

<meta name="description" content="AI NEWSへのお問い合わせはこちらから。">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
background:#f5f7fb;
color:#111827;
line-height:1.8;
}

a{
text-decoration:none;
color:#2563eb;
}

header{

background:#111827;

color:#fff;

padding:18px;

text-align:center;

font-size:28px;

font-weight:bold;

box-shadow:0 5px 20px rgba(0,0,0,.15);

}

.container{

max-width:900px;

margin:50px auto;

padding:40px;

background:#fff;

border-radius:24px;

box-shadow:0 15px 40px rgba(0,0,0,.08);

}

h1{

font-size:38px;

margin-bottom:25px;

}

p{

margin-bottom:18px;

font-size:18px;

}

.contact-box{

background:#f8fafc;

padding:30px;

border-radius:18px;

margin-top:30px;

border:1px solid #e5e7eb;

}

.contact-item{

margin-bottom:22px;

}

.contact-item h2{

font-size:22px;

margin-bottom:10px;

color:#2563eb;

}

.contact-item p{

font-size:17px;

}

.btn{

display:inline-block;

margin-top:20px;

padding:14px 28px;

background:#2563eb;

color:#fff;

border-radius:12px;

font-weight:bold;

transition:.25s;

}

.btn:hover{

background:#1d4ed8;

}

footer{

margin-top:60px;

padding:30px;

background:#111827;

color:#fff;

text-align:center;

}

footer a{

color:#93c5fd;

margin:0 10px;

}

@media(max-width:768px){

.container{

margin:20px;

padding:25px;

}

h1{

font-size:30px;

}

}

</style>
