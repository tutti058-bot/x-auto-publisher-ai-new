<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI NEWS</title>

<style>
body{
    margin:0;
    font-family:sans-serif;
    background:#f5f5f5;
}

header{
    background:#111827;
    color:#fff;
    padding:20px;
    text-align:center;
}

#news-list{
    width:90%;
    max-width:900px;
    margin:30px auto;
}

.card{
    background:#fff;
    border-radius:12px;
    overflow:hidden;
    box-shadow:0 5px 15px rgba(0,0,0,.1);
}

.card img{
    width:100%;
}

.content{
    padding:20px;
}

.title{
    font-size:28px;
    font-weight:bold;
    margin-bottom:15px;
}

.desc{
    line-height:1.8;
}
</style>

</head>

<body>

<header>
<h1>AI NEWS</h1>
<p>AI自動ニュース</p>
</header>

<div id="news-list"></div>

<script src="app.js"></script>

</body>
</html>
