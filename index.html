<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>AI NEWS</title>

<meta
name="description"
content="AIニュースをわかりやすく紹介するサイトです。">

<style>

body{
margin:0;
font-family:sans-serif;
background:#f5f5f5;
}

header{
background:#111827;
color:#fff;
padding:20px;
text-align:center;
}

#news-list{
width:90%;
max-width:900px;
margin:30px auto;
}

.card{
background:#fff;
border-radius:12px;
overflow:hidden;
box-shadow:0 5px 15px rgba(0,0,0,.1);
margin-bottom:30px;
}

.card img{
width:100%;
display:block;
}

.content{
padding:20px;
}

.title{
font-size:28px;
font-weight:bold;
margin-bottom:15px;
}

.desc{
line-height:1.8;
}

#pagination{
text-align:center;
margin:40px 0;
}

#pagination button{
padding:10px 16px;
margin:4px;
border:none;
border-radius:8px;
background:#2563eb;
color:#fff;
cursor:pointer;
font-size:15px;
}

#pagination button:hover{
opacity:.8;
}

#ranking{
width:90%;
max-width:900px;
margin:25px auto;
background:#fff;
border-radius:12px;
padding:20px;
box-shadow:0 5px 15px rgba(0,0,0,.08);
}

#ranking h2{
margin:0 0 15px;
}

.rank-item{
padding:12px 0;
border-bottom:1px solid #eee;
}

.rank-item:last-child{
border-bottom:none;
}

.rank-title{
font-weight:bold;
}

.rank-title a{
text-decoration:none;
color:#111827;
}

.rank-view{
color:#666;
font-size:14px;
}

.ranking-title{
    font-size:28px;
    font-weight:bold;
    margin-bottom:20px;
}

.rank-card{
    display:flex;
    align-items:center;
    gap:15px;
    background:#fff;
    border-radius:12px;
    padding:18px;
    margin-bottom:15px;
    box-shadow:0 3px 10px rgba(0,0,0,.08);
    transition:.2s;
}

.rank-card:hover{
    transform:translateY(-2px);
    box-shadow:0 8px 20px rgba(0,0,0,.12);
}

.rank-no{
    font-size:34px;
    width:60px;
    text-align:center;
}

.gold{
    background:#FFF8E1;
}

.silver{
    background:#F5F5F5;
}

.bronze{
    background:#FBE9E7;
}

.rank-info{
    flex:1;
}

.rank-info a{
    color:#111827;
    text-decoration:none;
    font-size:18px;
    font-weight:bold;
}

.rank-info a:hover{
    color:#2563eb;
}

.rank-view{
    margin-top:8px;
    color:#666;
    font-size:14px;
}

.site-header{
    background:#111827;
    padding:18px 0;
    text-align:center;
}

.logo img{
    width:280px;
    max-width:90%;
    height:auto;
}

</style>

</head>

<body>

<header class="site-header">

<a href="index.html" class="logo">

<img src="images/logo.png" alt="AI NEWS">

</a>

</header>

<div style="width:90%;max-width:900px;margin:20px auto;">

<input
type="text"
id="search"
placeholder="🔍 ニュースを検索..."
style="width:100%;padding:15px;font-size:16px;border-radius:10px;border:1px solid #ccc;">

</div>

<div
id="category-buttons"
style="text-align:center;margin:30px 0;display:flex;flex-wrap:wrap;gap:10px;justify-content:center;">

<button onclick="filterNews('ALL')">🤖 すべて</button>
<button onclick="filterNews('OpenAI')">💬 OpenAI</button>
<button onclick="filterNews('Google')">💎 Google</button>
<button onclick="filterNews('Anthropic')">🟣 Anthropic</button>
<button onclick="filterNews('Microsoft')">🪟 Microsoft</button>
<button onclick="filterNews('Meta')">🦙 Meta</button>
<button onclick="filterNews('xAI')">🚀 xAI</button>

</div>

<div id="ranking"></div>

<div id="news-list"></div>

<div id="pagination"></div>

<script type="module" src="app.js"></script>

</body>
</html>
