<title id="page-title">AI NEWS</title>

  name="description"
  content="AIニュースをわかりやすく紹介するサイトです。"

<style>
body{
    margin:0;
    font-family:sans-serif;
    background:#f5f5f5;
}

header{
    background:#111827;
    color:#fff;
    padding:20px;
    text-align:center;
}

#news-list{
    width:90%;
    max-width:900px;
    margin:30px auto;
}

.card{
    background:#fff;
    border-radius:12px;
    overflow:hidden;
    box-shadow:0 5px 15px rgba(0,0,0,.1);
    margin-bottom:30px;
}

.card img{
    width:100%;
}

.content{
    padding:20px;
}

.title{
    font-size:28px;

    margin-bottom:15px;

<body>

<header>
<h1>AI NEWS</h1>
<p>AI自動ニュース</p>
</header>

<div style="width:90%;max-width:900px;margin:20px auto;">
  <input
    type="text"
    id="search"
    placeholder="🔍 ニュースを検索..."
    style="width:100%;padding:15px;font-size:16px;border-radius:10px;border:1px solid #ccc;"
  >
</div>

<div id="category-buttons" style="text-align:center;margin:30px 0;display:flex;flex-wrap:wrap;gap:10px;justify-content:center;">
  <button onclick="filterNews('ALL')">🤖 すべて</button>
  <button onclick="filterNews('OpenAI')">💬 OpenAI</button>
  <button onclick="filterNews('Google')">💎 Google</button>
  <button onclick="filterNews('Anthropic')">🟣 Anthropic</button>
  <button onclick="filterNews('Microsoft')">🪟 Microsoft</button>
  <button onclick="filterNews('Meta')">🦙 Meta</button>
  <button onclick="filterNews('xAI')">🚀 xAI</button>
</div>

<div id="news-list"></div>

<script src="app.js"></script>
