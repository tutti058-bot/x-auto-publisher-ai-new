<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<meta name="google-site-verification" content="q32C9II99s52eLn7AgCdhIt6j3aRMIA82mfJ4vjyKQA" />

<script>

function gtag(){dataLayer.push(arguments);}

<title>AI NEWS</title>

<meta
name="description"
content="AIニュースをわかりやすく紹介するサイトです。">

<style>

  .side-menu{
    position:fixed;
    top:0;
    right:-320px;
    width:300px;
    height:100%;
    background:#111827;
    padding-top:80px;
    transition:.3s;
    z-index:10000;
    box-shadow:-5px 0 20px rgba(0,0,0,.2);
}

.side-menu.open{
    right:0;
}

.side-menu a{
    display:block;
    color:#fff;
    text-decoration:none;
    padding:18px 25px;
    border-bottom:1px solid rgba(255,255,255,.1);
    font-size:17px;
    transition:.2s;
}

.side-menu a:hover{
    background:#2563eb;
}

body{
margin:0;
font-family:sans-serif;
background:#f5f5f5;
}

header{
background:#111827;
color:#fff;
padding:20px;
text-align:center;
}

#news-list{
width:90%;
max-width:900px;
margin:30px auto;
}

.card{
background:#fff;
border-radius:12px;
overflow:hidden;
box-shadow:0 5px 15px rgba(0,0,0,.1);
margin-bottom:30px;
}

.card img{
width:100%;
display:block;
}

.content{
padding:20px;
}

.title{
font-size:28px;
font-weight:bold;
margin-bottom:15px;
}

.desc{
line-height:1.8;
}

#pagination{
text-align:center;
margin:40px 0;
}

#pagination button{
padding:10px 16px;
margin:4px;
border:none;
border-radius:8px;
background:#2563eb;
color:#fff;
cursor:pointer;
font-size:15px;
}

#pagination button:hover{
opacity:.8;
}

#ranking{
width:90%;
max-width:900px;
margin:25px auto;
background:#fff;
border-radius:12px;
padding:20px;
box-shadow:0 5px 15px rgba(0,0,0,.08);
}

#ranking h2{
margin:0 0 15px;
}

.rank-item{
padding:12px 0;
border-bottom:1px solid #eee;
}

.rank-item:last-child{
border-bottom:none;
}

.rank-title{
font-weight:bold;
}

.rank-title a{
text-decoration:none;
color:#111827;
}

.rank-view{
color:#666;
font-size:14px;
}

.ranking-title{
    font-size:28px;
    font-weight:bold;
    margin-bottom:20px;
}

.rank-card{
    display:flex;
    align-items:center;
    gap:15px;
    background:#fff;
    border-radius:12px;
    padding:18px;
    margin-bottom:15px;
    box-shadow:0 3px 10px rgba(0,0,0,.08);
    transition:.2s;
}

.rank-card:hover{
    transform:translateY(-2px);
    box-shadow:0 8px 20px rgba(0,0,0,.12);
}

.rank-no{
    font-size:34px;
    width:60px;
    text-align:center;
}

.gold{
    background:#FFF8E1;
}

.silver{
    background:#F5F5F5;
}

.bronze{
    background:#FBE9E7;
}

.rank-info{
    flex:1;
}

.rank-info a{
    color:#111827;
    text-decoration:none;
    font-size:18px;
    font-weight:bold;
}

.rank-info a:hover{
    color:#2563eb;
}

.rank-view{
    margin-top:8px;
    color:#666;
    font-size:14px;
}

.site-header{
    position:sticky;
    top:0;
    z-index:9999;
    background:#111827;
    padding:14px 0;
    text-align:center;
    box-shadow:0 3px 10px rgba(0,0,0,.15);
}

.logo img{
    width:280px;
    max-width:90%;
    height:auto;
}

.site-header{
    position:sticky;
    top:0;
    z-index:9999;
    background:#111827;
    box-shadow:0 4px 15px rgba(0,0,0,.15);
}

.header-inner{
    max-width:1200px;
    margin:auto;
    padding:12px 20px;
    display:flex;
    align-items:center;
    justify-content:space-between;
}

.logo img{
    width:180px;
    display:block;
}

.header-icons{
    display:flex;
    gap:10px;
}

.header-icons button{
    width:42px;
    height:42px;
    border:none;
    border-radius:10px;
    background:#1f2937;
    color:#fff;
    font-size:18px;
    cursor:pointer;
    transition:.2s;
}

.header-icons button:hover{
    background:#2563eb;
    transform:translateY(-2px);
}

@media(max-width:768px){

.logo img{
    width:150px;
}

.header-icons button{
    width:38px;
    height:38px;
    font-size:16px;
}

}

body.dark{
    background:#0f172a;
    color:#f8fafc;
}

body.dark .container{
    background:#1e293b;
    color:#fff;
}

body.dark .card{
    background:#1e293b;
    color:#fff;
}

body.dark .rank-item{
    background:#1e293b !important;
}

body.dark input{
    background:#111827;
    color:#fff;
    border:1px solid #374151;
}

body.dark h1,
body.dark h2,
body.dark h3,
body.dark p,
body.dark a{
    color:#fff;
}

</style>


</head>

<body>

<header class="site-header">

<div class="header-inner">

<a href="index.html" class="logo">
<img src="images/logo.png" alt="AI NEWS">
</a>

<div class="header-icons">

<button id="search-btn">🔍</button>

<button id="dark-btn">🌙</button>

<button id="menu-btn">☰</button>

</div>

</div>

</header>

<div id="side-menu" class="side-menu">

<a href="index.html">🏠 ホーム</a>

<a href="#" onclick="filterNews('ALL');closeMenu();">📰 すべて</a>

<a href="#" onclick="filterNews('OpenAI');closeMenu();">🤖 OpenAI</a>

<a href="#" onclick="filterNews('Google');closeMenu();">💎 Google</a>

<a href="#" onclick="filterNews('Anthropic');closeMenu();">🟣 Anthropic</a>

<a href="#" onclick="filterNews('Microsoft');closeMenu();">🪟 Microsoft</a>

<a href="#" onclick="filterNews('Meta');closeMenu();">🦙 Meta</a>

<a href="#" onclick="filterNews('xAI');closeMenu();">🚀 xAI</a>

</div>


<div style="width:90%;max-width:900px;margin:20px auto;">

<input
type="text"
id="search"
placeholder="🔍 ニュースを検索..."
style="width:100%;padding:15px;font-size:16px;border-radius:10px;border:1px solid #ccc;">

</div>

<div
id="category-buttons"
style="text-align:center;margin:30px 0;display:flex;flex-wrap:wrap;gap:10px;justify-content:center;">

<button onclick="filterNews('ALL')">🤖 すべて</button>
<button onclick="filterNews('OpenAI')">💬 OpenAI</button>
<button onclick="filterNews('Google')">💎 Google</button>
<button onclick="filterNews('Anthropic')">🟣 Anthropic</button>
<button onclick="filterNews('Microsoft')">🪟 Microsoft</button>
<button onclick="filterNews('Meta')">🦙 Meta</button>
<button onclick="filterNews('xAI')">🚀 xAI</button>

</div>

<div id="ranking"></div>

<div id="news-list"></div>

<div id="pagination"></div>

<script type="module" src="app.js"></script>

</body>
</html>
